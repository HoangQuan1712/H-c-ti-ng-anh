<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#032540" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Gradient Rounded Background -->
  <rect width="64" height="64" rx="18" ry="18" fill="url(#brandGrad)"/>
  
  <!-- Lightning Bolt Icon (Zap) -->
  <g transform="translate(10.4, 10.4) scale(1.8)" filter="url(#subtleGlow)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
